<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Arrow Path Studio</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0b0b10;--p:#16161d;--p2:#1f1f29;--ln:#2a2a37;--ink:#eceef7;--mut:#8d92ad;--ac:#19e3c1;--g:#4ade80;--r:#f43f5e;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:600 13px "Trebuchet MS",Verdana,sans-serif;display:flex;flex-direction:column;min-height:100vh}
header{display:flex;gap:8px;align-items:center;padding:8px 14px;background:var(--p);border-bottom:1px solid var(--ln);flex-wrap:wrap}
.logo{font-size:15px;letter-spacing:.5px}.logo i{color:var(--ac);font-style:normal}
main{flex:1;display:grid;grid-template-columns:250px minmax(0,1fr) 290px;min-height:0}
@media(max-width:980px){main{grid-template-columns:1fr}}
aside{background:var(--p);padding:12px;display:grid;gap:9px;align-content:start;overflow:auto;max-height:calc(100vh - 200px)}
@media(max-width:980px){aside{max-height:none}}
aside.r{border-left:1px solid var(--ln)}aside:not(.r){border-right:1px solid var(--ln)}
h3{margin:4px 0 0;font-size:11px;letter-spacing:1px;color:var(--mut);text-transform:uppercase}
section{padding:12px;display:grid;gap:8px;grid-template-rows:1fr auto;min-width:0;background:#0f0f15}
.stage{display:flex;justify-content:center;align-items:center;min-height:0}
canvas{max-width:100%;max-height:calc(100vh - 250px);background:#000;border-radius:10px;box-shadow:0 8px 30px #000a}
.ctl{display:flex;gap:10px;align-items:center;justify-content:center}.ctl small{color:var(--mut);max-width:50%}
#tm{font:700 14px monospace;color:var(--ac)}
label{display:grid;gap:4px;color:var(--mut);font-size:11px}
input,select{background:var(--p2);color:var(--ink);border:1px solid var(--ln);border-radius:7px;padding:7px;font:inherit;width:100%}
input[type=range]{padding:0}input[type=file]{padding:4px;font-size:10px}
.row{display:flex;gap:6px}.row>*{flex:1}.assets{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button{border:0;border-radius:8px;padding:8px 12px;font:800 12px inherit;color:var(--ink);background:var(--p2);cursor:pointer;border:1px solid var(--ln)}
button:hover{border-color:var(--ac)}button.x{background:var(--ac);color:#04221d;border:0}button.s{font-size:11px;padding:6px 9px}
button.play{width:48px;height:48px;border-radius:50%;background:#fff;color:#000;font-size:18px;border:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac)}
.tp{text-align:left;display:grid;gap:2px;padding:10px}.tp small{color:var(--mut);font-weight:600;line-height:1.35}.tp.on{border-color:var(--ac);background:#0f2e2a}
.chips{display:flex;flex-wrap:wrap;gap:4px;max-height:150px;overflow:auto}
.chip{min-width:34px;padding:5px 0;font-size:10px}.chip.on{background:var(--ac);color:#04221d;border:0}
#tl{display:flex;gap:4px;padding:10px 14px;background:var(--p);border-top:1px solid var(--ln);min-height:56px}
.clip{border-radius:8px;padding:12px 8px;color:#fff;font-size:11px;white-space:nowrap;overflow:hidden;opacity:.5;transition:.2s;text-align:center}.clip.on{opacity:1;outline:2px solid #fff}
#edp{display:none;gap:8px;background:#0f2e2a;border:1px solid var(--ac);border-radius:8px;padding:8px}#edp.on{display:grid}
</style></head><body>
<header><b class="logo">▶ ARROW PATH <i>Studio</i></b><span style="flex:1"></span><button class="s" id="db">⟳ Load levels from DB</button><button class="s" id="both">Export both formats</button><button class="x" id="rec">Export WebM</button></header>
<main>
<aside><h3>Templates</h3><div id="tpls" style="display:grid;gap:6px"></div>
<select id="tpl" hidden><option value="direct">direct</option><option value="cards">cards</option><option value="store">store</option></select>

<div class="chips" id="chips"></div><div class="row"><button class="s" id="all">All</button><button class="s" id="none">None</button></div>
<label>Levels JSON file (fallback)<input type="file" id="lf" accept=".json,.txt"></label></aside>
<section><div class="stage"><canvas id="cv" width="1920" height="1080"></canvas></div>
<div class="ctl"><button class="play" id="prev">▶</button><button class="s" id="stop">■ Stop</button><button class="s" id="edit">✎ Edit</button><span id="tm">00:00</span><small id="msg">Ready.</small></div></section>
<aside class="r"><div id="edp"><b>Layout editor</b>
<div class="row"><button class="s" id="sc1">Gameplay scene</button><button class="s" id="sc2">Ending scene</button></div>
<div id="edl" class="chips"></div>
<label>Size<input type="range" id="eds" min="0.3" max="3" step="0.05" value="1"></label>
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="edh" style="width:auto"> Hide this element</label>
<div class="row"><button class="s" id="edr">Reset element</button><button class="s" id="eda">Reset scene</button></div>
<small>Drag to move · corner square or mouse wheel to resize · double-click text to edit it</small></div>
<h3>Properties</h3>
<label>Video format<select id="asp"><option value="1920x1080">YouTube / Play Store 16:9 (1920×1080)</option><option value="1080x1920">TikTok / Shorts / Reels 9:16 (1080×1920)</option></select></label>
<label>Game name / logo text<input id="gname" value="ARROW PATH"></label>
<label>Tagline<input id="tag" value="Clear every arrow. Don't get blocked!"></label>
<label>Short description<input id="desc" value="Tap the arrows in the right order and escape the maze. Hundreds of colorful levels, easy to learn and hard to master."></label>
<label>Button text<input id="cta" value="Play now"></label>
<div class="row"><label>Arrows / level (Phone)<input type="number" id="apm" value="3" min="1"></label><label>Card to play (Cards)<input type="number" id="pc" value="2" min="1"></label></div>
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="endon" checked style="width:auto"> Add ending screen</label>
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="mis" checked style="width:auto"> One wrong tap per level (Direct/Cards)</label>
<label>Max seconds of tapping per level<input type="number" id="bud" value="14" min="3"></label>
<label>Speed<input type="range" id="spd" min="0.5" max="2.5" step="0.1" value="1"></label>
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="lcon" checked style="width:auto"> Level Complete popup (3 stars)</label>
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="clean" style="width:auto"> Clean video: no text / logo / button (add text in CapCut)</label>
<h3>Background</h3>
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="bgon" style="width:auto"> Custom colors</label>
<div class="row"><input type="color" id="bga" value="#1d2a5e"><input type="color" id="bgb" value="#080c1e"></div>
<button class="s" id="bgc">Remove background image</button>
<h3>Sound</h3>
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="sfxon" checked style="width:auto"> Sound effects (tap, swipe, stars, button)</label>
<label>Effects volume<input type="range" id="sfxv" min="0" max="1" step="0.05" value="0.8"></label>
<label>Background music (optional · mp3 / wav / ogg)<input type="file" id="musf" accept="audio/*"></label>
<label>Music volume<input type="range" id="musv" min="0" max="1" step="0.05" value="0.5"></label>
<div class="row"><button class="s" id="sndt">▶ Test sound</button><button class="s" id="musc">Remove music</button></div>
<h3>Images (saved in browser)</h3><div class="assets" id="assets"></div>
<div class="row"><label>Fingertip X %<input type="number" id="hx" value="38"></label><label>Fingertip Y %<input type="number" id="hy" value="5"></label></div>
<label>Hand size<input type="range" id="hs" min="0.5" max="2" step="0.1" value="1"></label>
</aside></main>
<div id="tl"></div>

if(p=show('en','btn')){const bw=e.bw*p.s,bh=e.bh*p.s;cx.save();ghost(p);btn(p.x*W,p.y*H,bw,bh,$('cta').value||'Play now',S.bp?.93:1+.035*Math.sin(t/250));cx.restore();hit('en','btn',p.x*W,p.y*H,bw,bh)}

async function card(h,s,b){S.mode='card';S.hand.v=0;S.card={h,s,b};S.k=0;await tween(S,{k:1},700);await sleep(1500);await tween(S,{k:0},300)}
async function cardsFlow(ids,tgt){S.phone=0;S.mode='cards';S.items=ids;S.cs=0;S.lvl='';S.cap='Choose a level';S.zoom=0;S.done=0;S.lives=3;const g=gsr(),H=S.hand,{cw,ch,cy}=cd(g),R=g.x+g.w*.8,Lf=g.x+g.w*.2,MY=g.y+g.h*.5;
setStep(0);H.x=g.x+g.w*.5;H.y=cv.height*1.05;H.s=1;H.v=1;await tween(H,{y:g.y+g.h*.8},500);await sleep(500);

for(let k=1;k<ids.length&&!stop;k++)await swipe(k);

setStep(1);const bh=ch*.1;await tween(H,{x:g.x+g.w/2,y:g.y+cy+ch/2-bh*.8},450);if(stop)return;
await tween(H,{s:.8},110);S.rip.push({x:H.x,y:H.y,r:10,a:1,c:'#4ade80'});sfx('click');await tween(H,{s:1},110);sfx('zoom');await tween(S,{zoom:1},450)}
async function playLevel(i,fast,limit=0){const L=norm(raw[i]);S.L=L;S.mode='play';S.zoom=0;S.lvl='LEVEL '+(i+1);S.cap='Tap a free arrow to clear it';S.intro=0;S.done=0;S.lives=3;
const H=S.hand;if(!H.v){H.x=cv.width*.5;H.y=cv.height*1.05;H.s=1;H.v=1}
const n=L.paths.length,per=limit?560:Math.max(130,Math.min(800,$('bud').value*1000/n))*(fast?.7:1);let tc=0,dm=limit||!$('mis').checked||n<4;
const pt=p=>{const g=gsr(),G=geo(L,g),a=p.pts[p.pts.length-2]||p.pts[0],b=p.pts[p.pts.length-1];return[g.x+G.ox+(a.x+b.x)/2*G.cs,g.y+G.oy+(a.y+b.y)/2*G.cs]};
const near=l=>l.map(p=>({p,q:pt(p)})).sort((a,b)=>Math.hypot(a.q[0]-H.x,a.q[1]-H.y)-Math.hypot(b.q[0]-H.x,b.q[1]-H.y))[0];
if(S.fade>0)tween(S,{fade:0},300);
sfx('intro');await tween(S,{intro:1},Math.min(limit?900:1400,500+n*8));await sleep(250);
while(!stop){if(limit&&tc>=limit)break;const free=L.paths.filter(p=>!p.st&&!blocked(p,L));if(!free.length)break;
if(!dm&&tc>=Math.floor(n*.4)){dm=true;const bl=L.paths.filter(p=>!p.st&&blocked(p,L));if(bl.length){const{p:w,q:wq}=near(bl);await tween(H,{x:wq[0],y:wq[1]},per*.8);if(stop)break;await tween(H,{s:.8},per*.15);S.rip.push({x:wq[0],y:wq[1],r:8,a:1,c:'#ef4444'});sfx('wrong');w.sh=22;S.lives--;await tween(H,{s:1},per*.15);await sleep(500);continue}}
const{p,q}=near(free);await tween(H,{x:q[0],y:q[1]},per*.6);if(stop)break;
await tween(H,{s:.8},per*.12);S.rip.push({x:q[0],y:q[1],r:8,a:1,c:neon(p.color)});burst(q[0],q[1],neon(p.color),10,4);p.st=1;p.t=0;sfx('tap');sfx('slide',fast?.5:.75);
tween(p,{t:1},fast?500:750,t=>t).then(()=>p.st=2);await tween(H,{s:1},per*.12);await sleep(per*.16);tc++}
while(L.paths.some(p=>p.st==1)&&!stop)await sleep(60);

S.cap='';if($('lcon').checked){const g=gsr();for(let k=0;k<3;k++)burst(g.x+Math.random()*g.w,g.y+g.h*.4,['#f43f5e','#3b82f6','#4ade80','#facc15'][k],24,8);S.st=0;S.ln=0;sfx('complete');await tween(S,{done:1},320);await tween(S,{st:2.5},580,t=>t);sfx('excellent');await tween(S,{st:3},120,t=>t);await sleep(fast?450:800);await tween(S,{done:0},200)}else await sleep(350);S.done=0}

await sleep(1400)}
